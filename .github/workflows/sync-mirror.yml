name: Sync Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync files to mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 .github/scripts/sync_mirror.py
