name: Sync Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync files to mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          python3 - <<'PYEOF'
          import base64, json, os, sys, time, urllib.request, urllib.parse, urllib.error

          token = os.environ["GITEE_TOKEN"]
          OWNER = "yan-tiantian"
          REPO = "search-term-system-dist"
          FILES = ["README.md", "config.json", "使用说明.md"]
          RETRIES = 3
          TIMEOUT = 90

          def api(path, method="GET", payload=None):
              url = "https://gitee.com/api/v5/repos/%s/%s/contents/%s" % (OWNER, REPO, urllib.parse.quote(path, safe=""))
              last = ("ERR", "unknown")
              for attempt in range(1, RETRIES + 1):
                  try:
                      if payload is not None:
                          data = urllib.parse.urlencode(payload).encode()
                          req = urllib.request.Request(url, data=data, method=method,
                              headers={"User-Agent": "sync", "Content-Type": "application/x-www-form-urlencoded"})
                      else:
                          req = urllib.request.Request(url, headers={"User-Agent": "sync"})
                      r = urllib.request.urlopen(req, timeout=TIMEOUT)
                      return r.status, json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and attempt < RETRIES:
                          last = (e.code, None)
                          time.sleep(2 * attempt)
                          continue
                      return e.code, None
                  except Exception as e:
                      last = ("ERR", str(e)[:120])
                      if attempt < RETRIES:
                          time.sleep(2 * attempt)
                          continue
              return last

          failed = []
          for name in FILES:
              if not os.path.exists(name):
                  continue
              with open(name, "rb") as f:
                  content = base64.b64encode(f.read()).decode()
              st, _ = api(name)
              payload = {"access_token": token, "content": content, "message": "sync " + name}
              if st == 200:
                  st2, info = api(name)
                  if info and "sha" in info:
                      payload["sha"] = info["sha"]
                      st3, _ = api(name, method="PUT", payload=payload)
                      if st3 == 200:
                          print("updated", name)
                      else:
                          failed.append(name)
                          print("PUT fail", name, st3)
                  else:
                      failed.append(name)
                      print("GET sha fail", name, st2)
              else:
                  st4, _ = api(name, method="POST", payload=payload)
                  if st4 == 201:
                      print("created", name)
                  else:
                      failed.append(name)
                      print("POST fail", name, st4)

          if failed:
              print("SYNC FAILED:", failed)
              sys.exit(1)
          print("ALL SYNCED")
          PYEOF
